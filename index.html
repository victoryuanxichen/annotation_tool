<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before the first paint (the setting itself lives in IndexedDB; see src/ui/theme.ts).
      try {
        var p = localStorage.getItem('pa-theme');
        var light = p === 'light' || (p === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {}
    </script>
    <title>Phase Annotator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2322272d'/%3E%3Crect x='3' y='7' width='4' height='2' fill='%235fb3a1'/%3E%3Crect x='7' y='7' width='6' height='2' fill='%23d9a54a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
